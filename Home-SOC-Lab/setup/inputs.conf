# Splunk Universal Forwarder - inputs.conf
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Purpose: Defines which Windows Event Log channels to collect and forward to Splunk

# ── Windows Security Log ──────────────────────────────────────
# Contains: Authentication events, account management, privilege use
# Key Event IDs: 4624 (logon), 4625 (failed logon), 4720 (account created),
#                4732 (added to group), 4672 (special privileges), 1102 (log cleared)
[WinEventLog://Security]
index = windows
disabled = 0
renderXml = false

# ── Windows System Log ────────────────────────────────────────
# Contains: System events, driver failures, service status changes
# Key Event IDs: 104 (log cleared), 7045 (service installed)
[WinEventLog://System]
index = windows
disabled = 0
renderXml = false

# ── Windows Application Log ───────────────────────────────────
# Contains: Application-level events and errors
[WinEventLog://Application]
index = windows
disabled = 0
renderXml = false

# ── PowerShell Operational Log ────────────────────────────────
# Contains: All PowerShell script block logging events
# Key Event IDs: 4103 (module logging), 4104 (script block logging)
# Requires: Script block logging enabled via Group Policy or registry
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
index = windows
disabled = 0
renderXml = false

# ── Sysmon Operational Log ────────────────────────────────────
# Contains: Enhanced endpoint telemetry from Sysinternals Sysmon
# Key Event IDs: 1 (process create), 3 (network connection),
#                11 (file create), 12/13 (registry events)
# Note: renderXml=true required for proper Sysmon field extraction
# Note: SplunkForwarder service must run as Local System to read this log
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
index = sysmon
disabled = 0
renderXml = true
