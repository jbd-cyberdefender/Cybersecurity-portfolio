# Splunk Universal Forwarder - outputs.conf
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\outputs.conf
# Purpose: Defines where to send collected logs (Splunk Enterprise server)

[tcpout]
defaultGroup = splunk-server

# ── Splunk Enterprise Destination ─────────────────────────────
# Update server IP to match your Splunk Enterprise installation
[tcpout:splunk-server]
server = 192.168.250.128:9997
